<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>智联客</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#eafff5,#f4fbff);color:#123d35}
.card{width:min(92vw,460px);background:#fff;border:1px solid #dcece6;border-radius:24px;padding:34px 22px;text-align:center;box-shadow:0 18px 60px #226b5422}
.brand{font-size:13px;font-weight:800;color:#168567;letter-spacing:.12em}
h1{font-size:26px;margin:10px 0 6px}
.tip{color:#607a73;font-size:14px;line-height:1.7;margin-bottom:18px}
.go{display:inline-block;border:0;border-radius:14px;padding:14px 26px;background:#168567;color:#fff;font-size:17px;font-weight:700;text-decoration:none}
.status{margin-top:14px;font-size:13px;color:#7b8f89}
.note{margin-top:16px;font-size:12px;color:#9ab0a9;display:none}
</style>
</head>
<body>
<main class="card">
  <div class="brand">智联客 · 固定入口</div>
  <h1>正在为您接入…</h1>
  <p class="tip">页面将自动跳转到微信官方接入页面。<br>如果长时间未跳转，请点击下方按钮。</p>
  <a class="go" id="btn" href="about:blank">点此进入</a>
  <div class="status" id="st">正在获取当前有效码…</div>
  <div class="note" id="note">若反复失败请稍后再试，本页地址永久不变</div>
</main>
<script>
const SRC="https://re395.com/api/fixed-entry.json";
let lastUrl=null, tries=0;
async function load(){
  const st=document.getElementById("st");
  try{
    const r=await fetch(SRC,{cache:"no-store"});
    if(!r.ok) throw new Error("http "+r.status);
    const j=await r.json();
    if(!j.url) throw new Error(j.message||"no-url");
    lastUrl=j.url;
    document.getElementById("btn").href=j.url;
    st.textContent="已获取当前有效码，正在跳转…";
    location.replace(j.url);
  }catch(e){
    tries++;
    st.textContent="获取失败，自动重试中（"+tries+"）…";
    if(tries>=3) document.getElementById("note").style.display="block";
  }
}
load();
setInterval(load,15000);
</script>
</body>
</html>
