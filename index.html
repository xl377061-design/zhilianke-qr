<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>智联客</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#eafff5,#f4fbff);color:#123d35;font-family:"Microsoft YaHei",system-ui,sans-serif}
.card{width:min(92vw,470px);background:#fff;border:1px solid #dcece6;border-radius:24px;padding:30px 20px;box-shadow:0 18px 60px #226b5422}
h1{font-size:22px;text-align:center;margin:6px 0 14px}
ol{padding-left:22px;line-height:2.1;font-size:15px}
li{color:#9ab0a9;transition:.3s}
li.on{color:#0a7a52;font-weight:700}
li.bad{color:#d33;font-weight:700}
#msg{margin-top:12px;padding:10px;border-radius:10px;background:#f3f8f6;color:#607a73;font-size:13px;min-height:38px;word-break:break-all}
.go{display:none;margin-top:14px;text-align:center}
.go a{display:inline-block;border-radius:14px;padding:13px 24px;background:#168567;color:#fff;font-size:16px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<h1>智联客 · 接入向导</h1>
<ol>
  <li id="s1">① GitHub 中转页打开</li>
  <li id="s2">② 向源站获取当前有效码</li>
  <li id="s3">③ 跳转微信官方接入页</li>
</ol>
<div id="msg">初始化…</div>
<div class="go"><a id="btn" href="#">点此手动进入</a></div>
</main>
<script>
const SRC="https://re395.com/api/fixed-entry.json";
const set=(id,st,txt)=>{const e=document.getElementById(id);e.className=st;if(txt)document.getElementById("msg").textContent=txt};
set("s1","on","中转页加载成功（第一跳正常）");
async function go(){
  set("s2","on","正在向源站请求当前有效码…");
  try{
    const r=await fetch(SRC,{cache:"no-store"});
    const j=await r.json();
    if(!j.url) throw new Error(j.message||"接口未返回链接");
    document.getElementById("btn").href=j.url;
    document.querySelector(".go").style.display="block";
    set("s3","on","已拿到官方链接，1.2 秒后自动进入…");
    set("msg",null,j.url);
    setTimeout(()=>location.replace(j.url),1200);
  }catch(e){
    set("s2","bad","第②跳失败: "+e.message);
    set("msg",null,"若持续失败请截图本页反馈；本页地址永久不变");
  }
}
go(); setInterval(go,15000);
</script>
</body>
</html>
